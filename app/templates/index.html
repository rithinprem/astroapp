<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroApp - Elegant Birth Details</title>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa841c;
            --light-gold: #f4ebd0;
            --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #f5f0e1 100%);
            --text-dark: #2c2c2c;
            --text-light: #6b6b6b;
            --white: #ffffff;
            --card-shadow: 0 10px 30px rgba(212, 175, 55, 0.12);
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; 
            margin: 0; 
            box-sizing: border-box;
            color: var(--text-dark);
        }

        .wrapper { 
            width: 100%;
            max-width: 540px; 
            margin: 0 auto; 
        }

        .form-card { 
            background: var(--white); 
            padding: 40px 35px; 
            border-radius: 16px; 
            border: 1px solid rgba(214, 175, 55, 0.2);
            box-shadow: var(--card-shadow); 
            position: relative;
            overflow: hidden;
        }

        /* Decorative top accent border line */
        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-gold), var(--dark-gold));
        }

        h2 { 
            margin-top: 0; 
            margin-bottom: 25px;
            color: var(--text-dark); 
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Responsive flex row for date and time input boxes */
        .form-row {
            display: flex;
            gap: 16px;
        }

        /* Top grid panels for saved people and create form */
        .top-grid {
            display: flex;
            gap: 18px;
            margin-bottom: 18px;
        }

        .panel {
            flex: 1;
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 10px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfaf7 100%);
            padding: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
        }

        .create-panel { max-width: 380px; }

        .panel.saved-panel { max-width: 260px; }

        .panel-title {
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .panel-body { display: block; position: relative; }

        .panel-hint { font-size: 12px; color: var(--text-light); margin-top: 8px; }

        /* Panel search input */
        .search-input { padding: 10px 12px; border-radius: 8px; border: 1px solid #e6e6e6; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); }

        .form-group.small { margin-bottom: 10px; }

        .form-group { 
            margin-bottom: 22px; 
            position: relative; 
            flex: 1;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: var(--text-dark); 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            color: var(--text-dark);
            background-color: #fcfdfa;
            transition: all 0.2s ease-in-out;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-gold);
            background-color: var(--white);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%); 
            color: var(--white); 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(170, 132, 28, 0.2);
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        button:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(170, 132, 28, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }

        /* Modernized Autocomplete Suggestion Dropdown List */
        .autocomplete-suggestions {
            position: absolute;
            z-index: 1000;
            background: var(--white);
            border: 1px solid rgba(214, 175, 55, 0.25);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 220px;
            overflow-y: auto;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: none;
            box-sizing: border-box;
        }

        /* Enhanced suggestion item styling */
        .suggestion-item { display: flex; flex-direction: column; align-items: flex-start; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f6f4ee; border-radius: 6px; margin: 6px; transition: background 0.12s ease, transform 0.06s ease; }
        .suggestion-item .meta { color: var(--text-light); font-size: 12px; margin-top: 6px; }
        .suggestion-item strong { color: var(--dark-gold); font-size: 14px; }

        .suggestion-item:last-child { margin-bottom: 4px; }

        .suggestion-item:hover { background: linear-gradient(90deg, rgba(212,175,55,0.06), rgba(170,132,28,0.03)); transform: translateY(-1px); }

        .suggestion-main { display: flex; flex-direction: column; }

        .loading-text {
            padding: 12px 14px;
            color: var(--text-light);
            font-size: 14px;
            font-style: italic;
        }

        /* Output View Styling Window */
        .result-card { 
            background: #1e1e1e; 
            color: #f4ebd0; 
            padding: 25px; 
            border-radius: 12px; 
            font-family: 'Courier New', monospace; 
            white-space: pre-wrap; 
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-left: 4px solid var(--primary-gold);
        }

        .result-card h3 {
            margin-top: 0;
            color: var(--white);
            font-family: 'Segoe UI', sans-serif;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Responsive Configurations for Smaller Handheld Viewports */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .form-card {
                padding: 30px 20px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="form-card">
        <h2>Enter Birth Details</h2>
        <form action="/chart" method="POST">

            <div class="top-grid">
                <div class="panel saved-panel">
                    <div class="panel-title">Saved People</div>
                    <div class="panel-body">
                        <input type="text" id="saved-search" class="search-input" placeholder="Search saved people..." autocomplete="off">
                        <div id="saved-suggestions" class="autocomplete-suggestions"></div>
                        <div class="panel-hint">Select a saved person to populate the form.</div>
                    </div>
                </div>

                <div class="panel create-panel">
                    <div class="panel-title">Create New Person</div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="fullname" id="fullname" placeholder="Full name">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" name="dob" id="dob" value="2000-09-09">
                            </div>
                            <div class="form-group">
                                <label>Time of Birth</label>
                                <input type="time" name="time" id="time" value="06:17">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Birth Place (City / Town)</label>
                            <input type="text" id="city-search" class="search-input" placeholder="Search birth location..." autocomplete="off">
                            <div id="suggestions-box" class="autocomplete-suggestions"></div>
                        </div>

                        <!-- Hidden geolocation fields (calculated from birthplace) -->
                        <input type="hidden" id="lat" name="lat" value="">
                        <input type="hidden" id="lon" name="lon" value="">
                        <input type="hidden" id="timezone" name="timezone" value="">

                        <div class="panel-hint">Fill these fields and click Calculate Charts.</div>
                    </div>
                </div>
            </div>

            <!-- Birth place search removed per request. Use latitude/longitude fields instead. -->

            <button type="submit">Calculate Charts</button>
        </form>
    </div>

    {% if result %}
    <div class="result-card">
        <h3>Calculated Varga Results:</h3>
{{ result | tojson(indent=2) }}
    </div>
    {% endif %}
</div>

<script>
    const savedSearch = document.getElementById('saved-search');
    const savedSuggestions = document.getElementById('saved-suggestions');
    const citySearch = document.getElementById('city-search');
    const suggestionsBox = document.getElementById('suggestions-box');
    const latInput = document.getElementById('lat');
    const lonInput = document.getElementById('lon');
    const tzInput = document.getElementById('timezone');
    

    // Saved people autocomplete (client-side filtering & sorting)
    let savedDebounce;
    let savedPeopleCache = null;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"'`=\/]/g, function (s) {
            return ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
                '/': '&#x2F;',
                '`': '&#96;',
                '=': '&#61;'
            })[s];
        });
    }

    // Highlight first matching substring in `text` with <strong>
    function highlightMatch(text, q) {
        if (!q) return escapeHtml(text);
        const idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return escapeHtml(text);
        const before = escapeHtml(text.slice(0, idx));
        const match = escapeHtml(text.slice(idx, idx + q.length));
        const after = escapeHtml(text.slice(idx + q.length));
        return `${before}<strong>${match}</strong>${after}`;
    }

    // Score function: higher score for prefix matches and name-word starts
    function scoreItem(item, q) {
        if (!q) return 0;
        const ql = q.toLowerCase();
        const name = (item.full_name || '').toLowerCase();
        const id = (item.id || '').toLowerCase();

        if (name.startsWith(ql)) return 100;
        // word-start matches (e.g., last name)
        const words = name.split(/\s+/);
        for (const w of words) { if (w.startsWith(ql)) return 90; }
        if (id.startsWith(ql)) return 85;
        if (name.includes(ql)) return 70;
        if (id.includes(ql)) return 60;
        return 0;
    }

    async function ensureSavedPeopleLoaded() {
        if (savedPeopleCache) return savedPeopleCache;
        const res = await fetch('/get_saved_people');
        savedPeopleCache = await res.json();
        return savedPeopleCache;
    }

    if (savedSearch) {
        savedSearch.addEventListener('input', function() {
            clearTimeout(savedDebounce);
            const query = this.value.trim();

            if (query.length < 1) {
                savedSuggestions.style.display = 'none';
                return;
            }

            savedDebounce = setTimeout(async () => {
                savedSuggestions.innerHTML = '<div class="loading-text">Searching saved people...</div>';
                savedSuggestions.style.display = 'block';

                try {
                    const all = await ensureSavedPeopleLoaded();
                    // Score and filter
                    const scored = all.map(item => ({ item, score: scoreItem(item, query) }))
                        .filter(r => r.score > 0)
                        .sort((a, b) => b.score - a.score || a.item.full_name.localeCompare(b.item.full_name))
                        .slice(0, 8)
                        .map(r => r.item);

                    savedSuggestions.innerHTML = '';
                    if (!scored || scored.length === 0) {
                        savedSuggestions.innerHTML = '<div class="loading-text">No saved people found</div>';
                        return;
                    }

                    scored.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        const nameHtml = highlightMatch(item.full_name || '', query);
                        const meta = escapeHtml(`${item.dob || ''} ${item.time || ''}`);
                        div.innerHTML = `<div class="suggestion-main">${nameHtml}<div class="meta">${meta}</div></div>`;

                        div.addEventListener('click', () => {
                            const fullnameInput = document.getElementById('fullname');
                            const dobInput = document.querySelector('input[name="dob"]');
                            const timeInput = document.querySelector('input[name="time"]');
                            if (fullnameInput) fullnameInput.value = item.full_name || '';
                            if (dobInput) dobInput.value = item.dob || '';
                            if (timeInput) timeInput.value = item.time || '';
                            latInput.value = item.lat || '';
                            lonInput.value = item.lon || '';
                            tzInput.value = item.timezone || 'Asia/Kolkata';

                            savedSuggestions.style.display = 'none';
                            const form = document.querySelector('form');
                            if (form) form.submit();
                        });

                        savedSuggestions.appendChild(div);
                    });
                } catch (err) {
                    console.error('Fetching saved people failed', err);
                    savedSuggestions.style.display = 'none';
                }
            }, 150);
        });
    }

    // Place autocomplete (Nominatim)
    let debounceTimer;
    if (citySearch) {
        citySearch.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value.trim();

            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(() => {
                suggestionsBox.innerHTML = '<div class="loading-text">Searching locations...</div>';
                suggestionsBox.style.display = 'block';

                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1`)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if (data.length === 0) {
                            suggestionsBox.innerHTML = '<div class="loading-text">No locations found</div>';
                            return;
                        }

                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = item.display_name;

                            div.addEventListener('click', () => {
                                citySearch.value = item.display_name;
                                latInput.value = item.lat;
                                lonInput.value = item.lon;
                                suggestionsBox.style.display = 'none';

                                // fetch timezone for the coordinates
                                fetchTimezone(item.lat, item.lon);
                            });
                            suggestionsBox.appendChild(div);
                        });
                    })
                    .catch(err => {
                        console.error("Geocoding failed", err);
                        suggestionsBox.style.display = 'none';
                    });
            }, 400);
        });
    }

    function fetchTimezone(lat, lon) {
        fetch(`https://timeapi.io/api/timezone/coordinate?latitude=${lat}&longitude=${lon}`)
            .then(res => res.json())
            .then(data => {
                if(data && data.timeZone) {
                    tzInput.value = data.timeZone;
                    console.log(`Autoassigned values: Lat ${lat}, Lon ${lon}, TZ ${data.timeZone}`);
                }
            })
            .catch(err => {
                console.warn("Timezone fallback applied: Defaulting to Asia/Kolkata", err);
                tzInput.value = "Asia/Kolkata";
            });
    }

    document.addEventListener('click', function(e) {
        if (savedSearch && e.target !== savedSearch && e.target !== savedSuggestions) {
            savedSuggestions.style.display = 'none';
        }
        if (citySearch && e.target !== citySearch && e.target !== suggestionsBox) {
            suggestionsBox.style.display = 'none';
        }
    });
</script>
</body>
</html>
